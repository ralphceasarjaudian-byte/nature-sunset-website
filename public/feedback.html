<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feedback — The Golden Hour Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .feedback-page { padding: 4rem 6vw; max-width: 720px; margin: 0 auto; }
  .feedback-page h1 { font-family: var(--font-display); font-size: 2rem; margin-bottom: 0.5rem; }
  .key-form { display: flex; gap: 0.6rem; margin: 1.5rem 0 2.5rem; }
  .key-form input {
    flex: 1; font-family: var(--font-body); font-size: 0.95rem;
    background: rgba(246,237,225,0.06); border: 1px solid rgba(246,237,225,0.25);
    border-radius: 4px; padding: 0.6rem 0.8rem; color: var(--sand-glow);
  }
  .key-form button {
    font-family: var(--font-mono); font-size: 0.8rem; background: var(--sunset-amber);
    border: none; color: var(--ink-shadow); padding: 0.6rem 1.2rem; border-radius: 999px; cursor: pointer;
  }
  .entry {
    border: 1px solid rgba(246,237,225,0.15); border-radius: 4px;
    padding: 1.2rem 1.4rem; margin-bottom: 1rem; background: var(--dusk-plum);
  }
  .entry__meta {
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--sunset-amber);
    text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 0.5rem;
  }
  .entry__message { margin: 0; font-size: 0.95rem; line-height: 1.5; }
  .empty-state, .error-state { color: var(--mist); font-size: 0.9rem; }
  .error-state { color: var(--coral-blaze); }
</style>
</head>
<body>
  <div class="feedback-page">
    <p class="eyebrow">admin</p>
    <h1>Submitted Feedback</h1>
    <p class="hero__sub" style="color:var(--mist)">Enter your admin key to view messages left through the site's feedback form.</p>

    <form class="key-form" id="keyForm">
      <input type="password" id="keyInput" placeholder="Admin key" autocomplete="off" />
      <button type="submit">View</button>
    </form>

    <div id="results"></div>
  </div>

  <script>
    const keyForm = document.getElementById("keyForm");
    const keyInput = document.getElementById("keyInput");
    const results = document.getElementById("results");

    const savedKey = sessionStorage.getItem("adminKey");
    if (savedKey) {
      keyInput.value = savedKey;
      loadFeedback(savedKey);
    }

    keyForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const key = keyInput.value.trim();
      if (!key) return;
      sessionStorage.setItem("adminKey", key);
      loadFeedback(key);
    });

    async function loadFeedback(key) {
      results.innerHTML = "<p class='empty-state'>Loading...</p>";
      try {
        const res = await fetch(`/api/feedback?key=${encodeURIComponent(key)}`);
        if (!res.ok) {
          results.innerHTML = "<p class='error-state'>Wrong key, or something went wrong.</p>";
          return;
        }
        const entries = await res.json();
        if (entries.length === 0) {
          results.innerHTML = "<p class='empty-state'>No feedback yet.</p>";
          return;
        }
        results.innerHTML = entries.map(e => `
          <div class="entry">
            <p class="entry__meta">${e.name} ${e.email ? "· " + e.email : ""} · ${new Date(e.submittedAt).toLocaleString()}</p>
            <p class="entry__message">${e.message.replace(/</g, "&lt;")}</p>
          </div>
        `).join("");
      } catch {
        results.innerHTML = "<p class='error-state'>Couldn't reach the server.</p>";
      }
    }
  </script>
</body>
</html>
